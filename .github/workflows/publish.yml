name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Two jobs, and the split is not cosmetic: `apt-get install` of TeX has taken this
# runner past twenty minutes without finishing, and while the registry step sat
# behind it, three releases went out with the registry still advertising 0.4.0. What
# MCP clients search and what npm clients install do not need to wait on each other.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # mcp-publisher authenticates to the MCP Registry with a GitHub OIDC token,
      # so publishing needs no long-lived secret and cannot be replayed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag, package.json and server.json agree
        run: |
          node -e "
          const pkg = require('./package.json');
          const srv = require('./server.json');
          const fail = (msg) => { console.error(msg); process.exit(1) };
          if (srv.version !== pkg.version) fail('server.json ' + srv.version + ' != package.json ' + pkg.version);
          for (const p of srv.packages || []) {
            if (p.version !== pkg.version) fail('server.json package version ' + p.version + ' != ' + pkg.version);
            if (p.identifier !== pkg.name) fail('server.json identifier ' + p.identifier + ' != ' + pkg.name);
          }
          if (srv.name !== pkg.mcpName) fail('server.json name ' + srv.name + ' != package.json mcpName ' + pkg.mcpName);
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (tag !== pkg.version) fail('tag ' + tag + ' != package.json ' + pkg.version);
          }
          console.log('version ' + pkg.version + ' agrees with the tag and server.json');
          "

      # A tag can be pushed for a version that was published by hand, and then this
      # job would fail on a version that already exists — reporting a broken release
      # that is in fact fine. Publish only what is missing.
      - name: Publish to npm, unless this exact version is already there
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; not republishing"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The registry is what MCP clients search; npm is what they install. A version
      # on npm that the registry does not know about is invisible to Claude Desktop.
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install TeX and Ghostscript
        run: |
          sudo apt-get update -qq
          # There is no `synctex` package on Ubuntu — the CLI lives in texlive-binaries,
          # which texlive-xetex pulls in. Naming it here failed the whole install.
          # texlive-fonts-extra is most of a gigabyte and took this job past ten
          # minutes on its own. What the suites actually use is here.
          sudo apt-get install -y -qq ghostscript texlive-xetex texlive-lang-chinese
      # The full suite needs beamer, tikz and a pile of font packages — about a
      # gigabyte of TeX. What runs here is what this job can actually prove: the
      # resolver, a real compile and render, escaped paths, and the MCP server.
      # `npm test` stays the local gate, and the windows job runs the same two
      # suites on the other platform.
      - run: node test/platform.mjs
      - run: node test/mcp.mjs
