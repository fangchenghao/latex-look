name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # mcp-publisher authenticates to the MCP Registry with a GitHub OIDC token,
      # so publishing needs no long-lived secret and cannot be replayed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install TeX and Ghostscript
        run: |
          sudo apt-get update -qq
          # There is no `synctex` package on Ubuntu — the CLI lives in texlive-binaries,
          # which texlive-xetex pulls in. Naming it here failed the whole install.
          # texlive-fonts-extra is most of a gigabyte and took this job past ten
          # minutes on its own. What the suites actually use is here: beamer and
          # tikz come from latex-recommended and pictures, CJK from lang-chinese.
          sudo apt-get install -y -qq ghostscript texlive-xetex texlive-lang-chinese
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "
          const p = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (p.version !== tag) { console.error('tag ' + tag + ' != package.json ' + p.version); process.exit(1) }
          "
      # The full suite needs beamer, tikz and a pile of font packages — about a
      # gigabyte of TeX, which turned a release into a 15-minute wait. What runs
      # here is what this job can actually prove: the resolver, a real compile and
      # render, escaped paths, and the MCP server. `npm test` stays the local gate,
      # and the windows job runs the same two suites on the other platform.
      - run: node test/platform.mjs
      - run: node test/mcp.mjs
      # A tag can be pushed for a version that was published by hand, and then this
      # job would fail on a version that already exists — reporting a broken release
      # that is in fact fine. Publish only what is missing.
      - name: Publish to npm, unless this exact version is already there
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; not republishing"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The registry is what MCP clients search; npm is what they install. A version
      # on npm that the registry does not know about is invisible to Claude Desktop.
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
