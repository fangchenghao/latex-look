name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install TeX and Ghostscript
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript texlive-xetex texlive-lang-chinese synctex texlive-fonts-extra
      - name: Check the tag matches package.json
        run: |
          node -e "
          const p = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (p.version !== tag) { console.error('tag ' + tag + ' != package.json ' + p.version); process.exit(1) }
          "
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
