name: windows

# The plugin was developed on macOS, where Ghostscript is called `gs`, PATH is
# split on ':', and a rename replaces the target. None of the three holds on
# Windows, and reading the code does not prove the fixes land: this job compiles a
# document, renders it, locates a point and speaks MCP on a real Windows runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Ghostscript and MiKTeX
        run: |
          choco install ghostscript -y --no-progress
          choco install miktex -y --no-progress

      - name: Put Ghostscript and TeX on PATH
        shell: pwsh
        run: |
          $gs = Get-ChildItem 'C:\Program Files\gs' -Directory -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending | Select-Object -First 1
          if (-not $gs) { throw 'ghostscript installed but C:\Program Files\gs is empty' }
          Write-Host "ghostscript: $($gs.FullName)"
          "$($gs.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Where the Chocolatey package puts TeX is not something to guess: search
          # the usual roots and report what was found either way.
          $roots = @(
            'C:\Program Files\MiKTeX',
            'C:\texlive',
            'C:\ProgramData\chocolatey\lib\miktex',
            "$env:APPDATA\TinyTeX",
            "$env:LOCALAPPDATA\Programs\TinyTeX"
          )
          $tex = $null
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { Write-Host "absent: $r"; continue }
            $hit = Get-ChildItem $r -Recurse -Filter 'xelatex.exe' -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if ($hit) { Write-Host "found: $($hit.FullName)"; $tex = $hit.DirectoryName; break }
            Write-Host "no xelatex.exe under: $r"
          }
          if (-not $tex) { throw 'no xelatex.exe under any of the usual TeX roots' }
          Write-Host "tex: $tex"
          $tex | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # The tests typeset Chinese. `fontset=fandol` needs the fandol package, which
          # MiKTeX installs on demand only when auto-install is on — and a first run
          # with it off is a compile error that looks like a plugin bug.
          try {
            & "$tex\initexmf.exe" --set-config-value "[MPM]AutoInstall=1" 2>&1 | Out-Host
            & "$tex\miktex.exe" packages install fandol ctex xecjk 2>&1 | Select-Object -Last 5 | Out-Host
          } catch {
            Write-Host "package pre-install skipped: $_"
          }

      - name: Show what the resolver finds
        shell: pwsh
        run: |
          node --input-type=module -e "
            import { resolveBinary, findGhostscript } from './lib/core.mjs'
            for (const b of ['xelatex', 'pdflatex', 'synctex']) console.log(b.padEnd(10), resolveBinary(b))
            console.log('gs'.padEnd(10), findGhostscript())
          "

      - name: Platform tests (resolver, escaped paths, a real compile and render)
        run: node test/platform.mjs

      - name: MCP server over stdio
        run: node test/mcp.mjs

      - name: The CLI, as a user would call it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\llwin" | Out-Null
          $tex = @'
          \documentclass{article}
          \begin{document}
          \noindent\rule{\textwidth}{0.4pt}
          Windows check.
          \end{document}
          '@
          Set-Content -Path "$env:RUNNER_TEMP\llwin\w.tex" -Value $tex -Encoding ascii
          node bin/latex-look.mjs "$env:RUNNER_TEMP\llwin\w.tex" --page 1
          node bin/latex-look.mjs "$env:RUNNER_TEMP\llwin\w.tex" --page 1 --point 300 78
          node bin/latex-look.mjs "$env:RUNNER_TEMP\llwin\w.tex" --version
